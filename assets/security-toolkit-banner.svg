<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Claude Security Skills Toolkit</title>
  <desc id="desc">Defensive auditing, secure coding, vulnerability remediation, and patch validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;70%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="80" r="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="160;220;160" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".18">
    <path d="M0 330 C300 220 430 440 730 300 S1180 220 1600 320" stroke-width="2"/>
    <path d="M0 365 C300 255 430 475 730 335 S1180 255 1600 355" stroke-width="1"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="92" y="150" font-size="58" font-weight="800" letter-spacing="-1.5">Claude Security</text>
    <text x="92" y="220" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#7dd3fc">Skills Toolkit</text>
    <text x="96" y="278" font-size="23" fill="#dbeafe">Audit. Validate. Patch. Prove the fix.</text>
    <text x="96" y="332" font-size="16" fill="#bfdbfe">Defensive workflows for authorized security engineering</text>
  </g>
  <g transform="translate(1320 236)" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-72 L68-42 V18 C68 68 0 94 0 94 S-68 68-68 18 V-42 Z" opacity=".9"/>
    <path d="M-32 4 L-8 28 38-24" stroke="#67e8f9"/>
  </g>
</svg>
